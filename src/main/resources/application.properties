spring.application.name=studentsystem

# JPA and Hibernate Configuration
spring.jpa.open-in-view=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Datasource Configuration (Ensure correct password for production)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/prjct_jee
spring.datasource.username=root
spring.datasource.password=

# Spring Security - Disabled for testing (remove in production)
spring.security.user.name=none
spring.security.user.password=none

# Swagger UI Configuration
springdoc.swagger-ui.enabled=true

logging.level.org.springframework.orm.jpa=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework=INFO
logging.level.org.hibernate=INFO
